<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Sito in manutenzione | Park App Reserve</title>
    <!-- Pagina autonoma: stili e icona sono qui dentro, così funziona anche se il resto del sito non risponde -->
    <style>
      :root {
        --primary: #de1f3c;
        --accent: #de1f3c;
        --bg: #f4f6fb;
        --card: rgba(255, 255, 255, 0.82);
        --text: #111827;
        --muted: #4b5563;
        --border: rgba(15, 23, 42, 0.1);
        --grid: rgba(15, 23, 42, 0.045);
        --glow: 16%;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #f0808f;
          --bg: #070a12;
          --card: rgba(19, 24, 38, 0.78);
          --text: #eef1f8;
          --muted: #a7aebf;
          --border: rgba(255, 255, 255, 0.09);
          --grid: rgba(255, 255, 255, 0.035);
          --glow: 26%;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background-color: var(--bg);
        background-image:
          radial-gradient(45rem 30rem at 12% -8%, color-mix(in srgb, var(--primary) var(--glow), transparent), transparent 70%),
          radial-gradient(40rem 32rem at 95% 5%, color-mix(in srgb, #7c3aed var(--glow), transparent), transparent 70%),
          radial-gradient(38rem 26rem at 70% 105%, color-mix(in srgb, #06b6d4 var(--glow), transparent), transparent 70%),
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: auto, auto, auto, 56px 56px, 56px 56px;
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
      }

      main {
        width: 100%;
        max-width: 30rem;
        padding: clamp(1.75rem, 6vw, 2.75rem);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        background: var(--card);
        backdrop-filter: blur(14px);
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.14);
        text-align: center;
      }

      svg {
        display: block;
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        color: var(--accent);
      }

      .brand {
        margin: 0 0 0.5rem;
        color: var(--accent);
        font-size: 0.9rem;
        font-weight: 600;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.6rem, 6vw, 2.1rem);
        line-height: 1.2;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }

      p { margin: 0; color: var(--muted); }
      p + p { margin-top: 0.75rem; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
      </svg>
      <p class="brand">Park App Reserve</p>
      <h1>Sito in manutenzione</h1>
      <p>Stiamo facendo alcuni lavori per migliorare il servizio, quindi al momento non puoi accedere né gestire le prenotazioni.</p>
      <p>Torneremo online al più presto. Grazie per la pazienza!</p>
    </main>
  </body>
</html>
